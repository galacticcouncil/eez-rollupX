# Vendored from galacticcouncil/hydration-zisk `crates/hydration-consensus-rules`
# and extended with genesis-configured `ProtocolRoles` and a skip of one leading
# EEZ `0x46` history transaction. The role-free functions keep that crate's
# signatures and verdicts (exhaustive tests compare them with the original rule),
# so Hydreth, its ZisK guest and this chain classify a block the same way under
# the legacy roles. Port rule changes to both copies. This manifest keeps the
# source crate's licence instead of inheriting this workspace's.
[package]
name                   = "hydration-consensus-rules"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license                = "Apache-2.0"
repository             = "https://github.com/galacticcouncil/hydration-zisk"
description            = "Portable consensus-critical rules for the Hydration protocol"

[dependencies]
alloy-primitives.workspace = true

[features]
default = ["std"]
std     = ["alloy-primitives/std"]

[lints]
workspace = true
