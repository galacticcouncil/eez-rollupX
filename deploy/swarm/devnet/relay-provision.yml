version: '3.8'
services:
  provision:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    entrypoint: [bash, /provision.sh]
    configs:
      - source: provision_v1
        target: /provision.sh
    secrets:
      - source: admin_password
        target: admin-password
      - source: relay_password
        target: relay-password
    networks: [database]
    deploy:
      replicas: 1
      restart_policy:
        condition: none
      placement:
        constraints: [node.labels.platform.data == true]
configs:
  provision_v1:
    file: ./provision-relay.sh
secrets:
  admin_password:
    external: true
    name: postgres_admin_password
  relay_password:
    external: true
    name: eez-devnet-relay-password
networks:
  database:
    external: true
    name: platform_database
