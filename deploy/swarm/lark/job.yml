version: '3.8'
# The lifecycle script binds exactly one versioned config, its owned volumes,
# and (for preparation only) the validator mnemonic secret.
services:
  job:
    image: ethpandaops/ethereum-genesis-generator@sha256:017f8bdbd454d2fcf4e0f65f6c64b5bc4c991f5846220e9be188145fa85875db
    entrypoint: [bash, /job.sh]
    logging:
      driver: json-file
      options: {max-size: '20m', max-file: '3'}
    deploy:
      replicas: 1
      placement:
        constraints: ['node.id == ${EEZ_LARK_DATA_NODE:?Select the persistent Lark data node}']
      restart_policy: {condition: none}
      update_config: {order: stop-first}
      rollback_config: {order: stop-first}
      resources:
        limits: {cpus: '2.0', memory: 2G}
        reservations: {cpus: '0.10', memory: 128M}
