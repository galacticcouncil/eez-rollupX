log_json = true
log_level = "info"
chain = "/genesis/metadata/genesis.json"
reth_datadir = "/builder"
coinbase_secret_key = "__COINBASE_KEY__"
relay_secret_key = "__BUILDER_BLS_KEY__"
cl_node_url = ["http://builder-beacon:5052"]
jsonrpc_server_port = 8645
jsonrpc_server_ip = "0.0.0.0"
el_node_ipc_path = "/tmp/reth.ipc"
extra_data = "eez-lark-builder"
genesis_fork_version = "__GENESIS_FORK__"
ignore_cancellable_orders = true
live_builders = ["mp-ordering", "mgp-ordering"]
enabled_relays = ["lark"]
root_hash_use_sparse_trie = true
root_hash_compare_sparse_trie = false
# Private-chain bid budget in test ETH; not an application fee/pricing policy.
subsidy = "0.01"
slot_delta_to_start_bidding_ms = -12000

[[relays]]
name = "lark"
url = "http://__RELAY_PUBLIC_KEY__@relay-api:9062"
priority = 0
use_ssz_for_submit = false
use_gzip_for_submit = false

[[builders]]
name = "mgp-ordering"
algo = "ordering-builder"
discard_txs = true
sorting = "mev-gas-price"
failed_order_retries = 1
drop_failed_orders = true

[[builders]]
name = "mp-ordering"
algo = "ordering-builder"
discard_txs = true
sorting = "max-profit"
failed_order_retries = 1
drop_failed_orders = true
