version: '3.8'
services:
  fund:
    image: ${EEZ_DEVNET_DEPLOY_IMAGE:?Select the matching deployment image}
    entrypoint: [bash, /fund.sh]
    configs:
      - source: fund_v1
        target: /fund.sh
      - source: fixtures_v1
        target: /l2-fixtures.env
    networks: [l1]
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: '3'}
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.platform.data == true]
      restart_policy:
        condition: none
configs:
  fund_v1:
    file: ../scripts/fund-builder.sh
  fixtures_v1:
    file: ../fixtures/l2-fixtures.env
networks:
  l1:
    external: true
    name: eez-devnet_l1
