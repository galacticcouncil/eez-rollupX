version: '3.8'
services:
  canary:
    image: ${EEZ_DEVNET_DEPLOY_IMAGE:?Select the matching deployment image}
    entrypoint: [bash, /canary.sh]
    configs:
      - source: canary_v1
        target: /canary.sh
    networks: [l1]
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: '3'}
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.platform.data == true]
      restart_policy:
        condition: none
configs:
  canary_v1:
    file: ../checks/pbs-canary.sh
networks:
  l1:
    external: true
    name: eez-devnet_l1
